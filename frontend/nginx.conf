server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 显式声明 UTF-8,避免客户端按 Latin-1 解码中文页面
    charset utf-8;

    # SPA 路由回退:未知路径一律返回 index.html(交给 vue-router 处理)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存,保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
